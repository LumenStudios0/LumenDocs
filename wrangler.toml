name = "lumen-docs-assistant"
main = "worker/chat.js"
compatibility_date = "2026-11-08"
workers_dev = true
routes = [
  { pattern = "lumenstudio.fyi/api/*", zone_name = "lumenstudio.fyi" },
  { pattern = "lumenstudio.fyi/auth/*", zone_name = "lumenstudio.fyi" }
]

[vars]
ALLOWED_ORIGIN = "https://lumenstudio.fyi"
ALLOWED_ORIGINS = "https://www.lumenstudio.fyi,https://lumenstudios0.github.io"
DISCORD_CALLBACK_URL = "https://lumen-docs-assistant.lumennetwork0.workers.dev/auth/callback"
ADMIN_DISCORD_IDS = ""

[[ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "lumen-community"
database_id = "REPLACE_WITH_PROVISIONED_D1_DATABASE_ID"
migrations_dir = "worker/migrations/community"

[triggers]
crons = ["*/5 * * * *"]
