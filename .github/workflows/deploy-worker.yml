name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "shared/**"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision community D1 and apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a repository Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a repository Actions variable."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          }
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/d1/database`
          async function cloudflare(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...options.headers } })
            let result
            try { result = await response.json() } catch { throw new Error('Cloudflare D1 API returned an invalid response') }
            if (!response.ok || !result.success) {
              const details = (result.errors ?? []).map(error => error.code).filter(Boolean).join(', ')
              throw new Error(
                `Cloudflare D1 provisioning failed${details ? ` (codes: ${details})` : ''}. ` +
                'Grant the configured API token D1:Edit for this account, verify the account ID, and rerun; deployment is stopped.',
              )
            }
            return result
          }
          let databases = await cloudflare(`${endpoint}?per_page=100`)
          let database = (databases.result ?? []).find(item => item.name === 'lumen-community')
          if (!database) {
            const created = await cloudflare(endpoint, {
              method: 'POST',
              body: JSON.stringify({ name: 'lumen-community' }),
            })
            database = created.result
          }
          if (!database?.uuid) throw new Error('Cloudflare did not return the community D1 database ID')
          const config = await readFile('wrangler.toml', 'utf8')
          const placeholder = 'REPLACE_WITH_PROVISIONED_D1_DATABASE_ID'
          if (!config.includes(placeholder) && !config.includes(database.uuid)) {
            throw new Error('wrangler.toml does not contain the community D1 database placeholder')
          }
          await writeFile('wrangler.toml', config.replaceAll(placeholder, database.uuid))
          NODE
          if ! npx --yes wrangler@4.160.0 d1 migrations apply lumen-community --remote; then
            echo "::error::Community D1 migration failed. Confirm the API token has D1:Edit for the configured account; deployment is stopped."
            exit 1
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 deploy
          npx --yes wrangler@4.160.0 d1 execute lumen-community --remote --json \
            --command "UPDATE lumen_points_accounts SET backfill_attempted_at=NULL,backfill_error=NULL WHERE staff_checked_at IS NULL AND (backfill_error LIKE 'Staff-license prices are unavailable%' OR backfill_error LIKE 'Staff-license point pricing is not configured%')"
      - name: Verify staff starter XP awards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 d1 execute lumen-community --remote --json \
            --command "SELECT COUNT(*) AS recipients, COALESCE(SUM(points), 0) AS awarded_xp, MIN(points) AS min_points, MAX(points) AS max_points, (SELECT COUNT(*) FROM website_access_audit WHERE action = 'staff.xp.starter_award') AS audit_entries FROM staff_xp_ledger WHERE source_type = 'starter_bonus'" \
            > "$RUNNER_TEMP/staff-starter-xp.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const result = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/staff-starter-xp.json`, 'utf8'))
          const award = result[0]?.results?.[0]
          if (!award || award.recipients < 1 || award.min_points !== 10 || award.max_points !== 10 ||
              award.awarded_xp !== award.recipients * 10 || award.audit_entries !== award.recipients) {
            throw new Error('Staff starter XP awards or their audit entries did not verify.')
          }
          console.log(`Verified one-time starter bonus: ${award.recipients} staff received 10 XP each (${award.awarded_xp} XP total), with matching audit entries.`)
          NODE
      - name: Verify public community status API
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from 'node:timers/promises'
          const endpoint = 'https://lumen-docs-assistant.lumennetwork0.workers.dev/community/status'
          const startedAt = Date.now()
          const deadline = startedAt + 330000
          async function probe() {
          const response = await fetch(endpoint, {
            headers: { Origin: 'https://lumenstudio.fyi' },
            signal: AbortSignal.timeout(10000),
          })
          if (!response.ok) throw new Error(`Community status smoke test failed: HTTP ${response.status}`)
          const payload = await response.json()
          const expected = ['website', 'discord', 'licensing', 'builtbybit'].sort()
          if (payload.intervalMinutes !== 5 || !Array.isArray(payload.services) ||
              payload.services.map(service => service.id).sort().join(',') !== expected.join(',')) {
            throw new Error('Community status response has an unexpected service list or check interval')
          }
          const allowed = new Set(['operational', 'degraded', 'outage', 'maintenance', 'unknown'])
          for (const service of payload.services) {
            if (!allowed.has(service.status) || !allowed.has(service.automaticStatus) ||
                !(service.overrideStatus === null || allowed.has(service.overrideStatus)) ||
                !(service.checkedAt === null || (typeof service.checkedAt === 'string' && Number.isFinite(Date.parse(service.checkedAt)))) ||
                typeof service.name !== 'string' ||
                typeof service.message !== 'string' || Object.hasOwn(service, 'lastCheckedAt')) {
              throw new Error(`Community status fields are invalid for service ${service.id}`)
            }
          }
          return payload
          }
          let payload = await probe()
          console.log('Community D1 status endpoint is public and its response schema is valid.')
          while (!payload.services.every(service => service.checkedAt && Date.parse(service.checkedAt) >= startedAt)) {
            if (Date.now() >= deadline) {
              throw new Error('Automatic community checks did not refresh within the five-minute cron window plus execution grace. Verify the Worker cron trigger is active; a newly configured Cloudflare cron may still be propagating.')
            }
            await delay(15000)
            payload = await probe()
          }
          console.log('Automatic community checks refreshed all services; unhealthy or unconfigured services are valid health results.')
          NODE
      - name: Verify Discord sign-in redirect
        run: |
          node --input-type=module <<'NODE'
          const loginUrl = new URL('https://lumen-docs-assistant.lumennetwork0.workers.dev/auth/login')
          const response = await fetch(loginUrl, { redirect: 'manual' })
          const location = response.headers.get('location')
          if (response.status !== 302 || !location) {
            throw new Error(`Discord login is not reachable: status=${response.status}`)
          }
          const authorizeUrl = new URL(location)
          if (authorizeUrl.origin !== 'https://discord.com' || authorizeUrl.pathname !== '/oauth2/authorize') {
            throw new Error(`Discord login did not redirect to OAuth: ${authorizeUrl.origin}${authorizeUrl.pathname}`)
          }
          const callbackUrl = new URL(authorizeUrl.searchParams.get('redirect_uri'))
          const state = authorizeUrl.searchParams.get('state')
          const cookie = response.headers.get('set-cookie') || ''
          if (callbackUrl.origin !== loginUrl.origin || callbackUrl.pathname !== '/auth/callback' ||
              !state || !cookie.includes(`lumen_discord_oauth_state=${state};`) ||
              !cookie.includes('Path=/auth/callback;')) {
            throw new Error('Discord login and its state cookie must use the same callback host and path.')
          }
          console.log('Discord OAuth is reachable and the callback matches the login cookie host.')
          NODE
      - name: Verify public publishing and incident APIs
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://lumen-docs-assistant.lumennetwork0.workers.dev'
          for (const path of ['/community/updates', '/community/incidents', '/studio/releases']) {
            const response = await fetch(base + path, {
              headers: { Origin: 'https://lumenstudio.fyi' },
              signal: AbortSignal.timeout(10000),
            })
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`)
            const payload = await response.json()
            if (!Array.isArray(payload.items) || !Number.isInteger(payload.total) || payload.page !== 1) {
              throw new Error(`${path} returned an invalid page`)
            }
            if (path === '/studio/releases' && payload.items.some(item => item.published !== true)) {
              throw new Error('Public release feed exposed a draft')
            }
            console.log(path, 'is available and returns a valid public page.')
          }
          NODE
      - name: Verify admin API CORS
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://lumenstudio.fyi/api/admin/users'
          const origin = 'https://lumenstudio.fyi'
          const preflight = await fetch(endpoint, {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'GET',
              'Access-Control-Request-Headers': 'authorization',
            },
          })
          if (preflight.status !== 204 || preflight.headers.get('access-control-allow-origin') !== origin) {
            throw new Error(`Admin CORS preflight failed: status=${preflight.status}, allow-origin=${preflight.headers.get('access-control-allow-origin')}`)
          }
          const response = await fetch(endpoint, {
            headers: { Origin: origin, Authorization: 'Bearer invalid-deployment-smoke-test' },
          })
          if (response.status !== 401 || response.headers.get('access-control-allow-origin') !== origin) {
            throw new Error(`Admin endpoint smoke test failed: status=${response.status}, allow-origin=${response.headers.get('access-control-allow-origin')}, body=${await response.text()}`)
          }
          console.log('Same-origin admin route and authenticated API response are reachable.')
          NODE
      - name: Verify private account APIs reject anonymous access
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://lumen-docs-assistant.lumennetwork0.workers.dev'
          for (const path of ['/studio/downloads', '/studio/downloads/00000000-0000-0000-0000-000000000000', '/studio/coupons', '/studio/staff/coupons', '/community/staff/progression', '/studio/points', '/studio/points/sync', '/studio/points/referral', '/studio/points/shop', '/studio/points/shop/redeem', '/studio/points/shop/fulfill', '/studio/staff/points/123456789012345678']) {
            const response = await fetch(base + path, {
              method: ['/studio/points/sync', '/studio/points/referral', '/studio/points/shop/redeem', '/studio/points/shop/fulfill'].includes(path) ? 'POST' : 'GET',
              headers: { Origin: 'https://lumenstudio.fyi' },
              signal: AbortSignal.timeout(10000),
            })
            if (response.status !== 401 || response.headers.has('Content-Disposition')) {
              throw new Error('Private account API authentication smoke check failed.')
            }
          }
          console.log('Plugin downloads, coupons, staff progression and member points reject anonymous requests.')
          NODE
      - name: Verify member points storage and historical credits
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 d1 execute lumen-community --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM lumen_points_accounts) AS wallets, (SELECT COUNT(DISTINCT referral_code) FROM lumen_points_accounts) AS unique_codes, (SELECT COUNT(*) FROM lumen_points_accounts WHERE length(referral_code)!=15 OR referral_code NOT GLOB 'LP-*') AS invalid_codes, (SELECT COUNT(*) FROM lumen_points_rewards WHERE points_units<0) AS invalid_rewards, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('lumen_points_awarded','lumen_points_adjusted')) AS ledger_triggers, (SELECT COUNT(*) FROM sqlite_master WHERE name IN ('lumen_points_orders','lumen_points_shop_entitlements','lumen_points_shop_events','lumen_points_balances','lumen_points_shop_spent','lumen_points_shop_refunded')) AS shop_objects, (SELECT COUNT(*) FROM lumen_points_balances) AS shop_wallets" \
            > "$RUNNER_TEMP/lumen-points-storage.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          import { setTimeout as delay } from 'node:timers/promises'
          const result = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/lumen-points-storage.json`, 'utf8'))
          const data = result[0]?.results?.[0]
          if (!data || data.wallets !== data.unique_codes || data.invalid_codes !== 0 ||
              data.invalid_rewards !== 0 || data.ledger_triggers !== 2 || data.shop_objects !== 6 || data.shop_wallets !== data.wallets) {
            throw new Error('Lumen Points wallets, referral uniqueness or ledger triggers did not verify.')
          }
          console.log(`Lumen Points storage verified: ${data.wallets} wallets with unique referral codes and both audit-history triggers.`)
          console.log(`Points shop verified: orders, entitlements, spending/refund history and ${data.shop_wallets} spendable wallets.`)
          const deadline = Date.now() + 660000
          const sql = `SELECT
            (SELECT COUNT(*) FROM lumen_points_accounts WHERE purchase_checked_at IS NULL OR tier_checked_at IS NULL OR staff_checked_at IS NULL) AS pending,
            (SELECT COUNT(*) FROM lumen_points_accounts WHERE (purchase_checked_at IS NULL OR tier_checked_at IS NULL OR staff_checked_at IS NULL) AND backfill_error IS NOT NULL) AS failed,
            (SELECT GROUP_CONCAT(DISTINCT backfill_error) FROM lumen_points_accounts WHERE purchase_checked_at IS NULL OR tier_checked_at IS NULL OR staff_checked_at IS NULL) AS errors,
            (SELECT COUNT(DISTINCT user_id) FROM lumen_points_rewards WHERE kind='purchase' AND points_units>0) AS recipients,
            (SELECT COALESCE(SUM(points_units),0)/100.0 FROM lumen_points_rewards WHERE kind='purchase') AS purchase_points,
            (SELECT COALESCE(SUM(points_units),0)/100.0 FROM lumen_points_rewards WHERE kind='tier') AS tier_points,
            (SELECT COUNT(DISTINCT user_id) FROM lumen_points_staff_rewards WHERE points_units>0) AS gift_recipients,
            (SELECT COALESCE(SUM(points_units),0)/100.0 FROM lumen_points_staff_rewards) AS gift_points,
            (SELECT COUNT(*) FROM lumen_points_history h WHERE delta_units>0 AND NOT EXISTS(SELECT 1 FROM community_notifications n WHERE n.id='points:earn:'||h.id)) AS missing_notices,
            (SELECT COUNT(*) FROM lumen_points_adjustments a WHERE NOT EXISTS(SELECT 1 FROM community_notifications n WHERE n.id='points:adjust:'||a.id)) AS missing_adjustment_notices,
            (SELECT GROUP_CONCAT(DISTINCT value) FROM lumen_points_accounts,json_each(staff_deferred_products)) AS unpriced_products`
          while (true) {
            const result = JSON.parse(execFileSync('npx', ['--yes', 'wrangler@4.160.0', 'd1', 'execute',
              'lumen-community', '--remote', '--json', '--command', sql], { encoding: 'utf8', timeout: 60000 }))
            const summary = result[0]?.results?.[0]
            if (!summary) throw new Error('Historical points verification returned no result.')
            if (summary.missing_notices || summary.missing_adjustment_notices) throw new Error('Points credit notifications are missing.')
            if (summary.failed) throw new Error(`Historical purchase checks failed for ${summary.failed} accounts: ${summary.errors}`)
            if (!summary.pending) {
              console.log(`Historical purchase credits verified: ${summary.recipients} members, ${summary.purchase_points} purchase LP, ${summary.tier_points} milestone LP.`)
              console.log(`Staff-license credits verified: ${summary.gift_recipients} members, ${summary.gift_points} LP. All previous and new credits have private notifications.`)
              console.log(`License products awaiting published prices: ${summary.unpriced_products || 'none'}. Members see these as deferred, not awarded.`)
              break
            }
            if (Date.now() >= deadline) throw new Error(`Historical purchase checks are still pending for ${summary.pending} members.`)
            console.log(`Waiting for scheduled purchase backfill: ${summary.pending} accounts remaining.`)
            await delay(20000)
          }
          NODE
      - name: Publish customer-only 48-hour roundup and member announcement
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 d1 execute lumen-community --remote --file worker/public-updates/2026-11-17.sql
          node --input-type=module <<'NODE'
          const response = await fetch('https://lumen-docs-assistant.lumennetwork0.workers.dev/community/updates?pageSize=100', {
            headers: { Origin: 'https://lumenstudio.fyi' }, signal: AbortSignal.timeout(10000),
          })
          if (!response.ok) throw new Error('Public studio roundup could not be read.')
          const payload = await response.json()
          const item = payload.items?.find(row => row.id === '19ca0e88-4ff1-47d1-8769-cc8b00020261')
          if (!item || !item.body.includes('Lumen Points') || /token|migration|secret|backend|commit|workflow/i.test(item.body)) {
            throw new Error('Customer-only studio roundup did not verify.')
          }
          console.log('Customer-only 48-hour roundup is public and broadcast to the all-members update audience.')
          NODE
      - name: Publish customer-only 88-hour release notes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 d1 execute lumen-community --remote --file worker/public-updates/2026-11-17-88-hours.sql
          node --input-type=module <<'NODE'
          const response = await fetch('https://lumen-docs-assistant.lumennetwork0.workers.dev/community/updates?pageSize=100', {
            headers: { Origin: 'https://lumenstudio.fyi' }, signal: AbortSignal.timeout(10000),
          })
          if (!response.ok) throw new Error('Public release notes could not be read.')
          const payload = await response.json()
          const item = payload.items?.find(row => row.id === 'd9564bf3-d7e7-45a8-8175-22802e3d5965')
          if (!item || !item.body.includes('November 14-17') || /token|migration|secret|backend|commit|workflow|webhook|D1|Worker/i.test(item.body)) {
            throw new Error('Customer-only 88-hour release notes did not verify.')
          }
          console.log('Customer-only 88-hour release notes are public and broadcast to the all-members update audience.')
          NODE
