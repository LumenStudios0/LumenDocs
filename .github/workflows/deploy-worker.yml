name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision community D1 and apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a repository Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a repository Actions variable."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          }
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/d1/database`
          async function cloudflare(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...options.headers } })
            let result
            try { result = await response.json() } catch { throw new Error('Cloudflare D1 API returned an invalid response') }
            if (!response.ok || !result.success) {
              const details = (result.errors ?? []).map(error => error.code).filter(Boolean).join(', ')
              throw new Error(
                `Cloudflare D1 provisioning failed${details ? ` (codes: ${details})` : ''}. ` +
                'Grant the configured API token D1:Edit for this account, verify the account ID, and rerun; deployment is stopped.',
              )
            }
            return result
          }
          let databases = await cloudflare(`${endpoint}?per_page=100`)
          let database = (databases.result ?? []).find(item => item.name === 'lumen-community')
          if (!database) {
            const created = await cloudflare(endpoint, {
              method: 'POST',
              body: JSON.stringify({ name: 'lumen-community' }),
            })
            database = created.result
          }
          if (!database?.uuid) throw new Error('Cloudflare did not return the community D1 database ID')
          const config = await readFile('wrangler.toml', 'utf8')
          const placeholder = 'REPLACE_WITH_PROVISIONED_D1_DATABASE_ID'
          if (!config.includes(placeholder) && !config.includes(database.uuid)) {
            throw new Error('wrangler.toml does not contain the community D1 database placeholder')
          }
          await writeFile('wrangler.toml', config.replaceAll(placeholder, database.uuid))
          NODE
          if ! npx --yes wrangler@4.160.0 d1 migrations apply lumen-community --remote; then
            echo "::error::Community D1 migration failed. Confirm the API token has D1:Edit for the configured account; deployment is stopped."
            exit 1
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 deploy
      - name: Verify public community status API
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from 'node:timers/promises'
          const endpoint = 'https://lumen-docs-assistant.lumennetwork0.workers.dev/community/status'
          const startedAt = Date.now()
          const deadline = startedAt + 330000
          async function probe() {
          const response = await fetch(endpoint, {
            headers: { Origin: 'https://lumenstudio.fyi' },
            signal: AbortSignal.timeout(10000),
          })
          if (!response.ok) throw new Error(`Community status smoke test failed: HTTP ${response.status}`)
          const payload = await response.json()
          const expected = ['website', 'discord', 'licensing'].sort()
          if (payload.intervalMinutes !== 5 || !Array.isArray(payload.services) ||
              payload.services.map(service => service.id).sort().join(',') !== expected.join(',')) {
            throw new Error('Community status response has an unexpected service list or check interval')
          }
          const allowed = new Set(['operational', 'degraded', 'outage', 'maintenance', 'unknown'])
          for (const service of payload.services) {
            if (!allowed.has(service.status) || !allowed.has(service.automaticStatus) ||
                !(service.overrideStatus === null || allowed.has(service.overrideStatus)) ||
                !(service.checkedAt === null || (typeof service.checkedAt === 'string' && Number.isFinite(Date.parse(service.checkedAt)))) ||
                typeof service.name !== 'string' ||
                typeof service.message !== 'string' || Object.hasOwn(service, 'lastCheckedAt')) {
              throw new Error(`Community status fields are invalid for service ${service.id}`)
            }
          }
          return payload
          }
          let payload = await probe()
          console.log('Community D1 status endpoint is public and its response schema is valid.')
          while (!payload.services.every(service => service.checkedAt && Date.parse(service.checkedAt) >= startedAt)) {
            if (Date.now() >= deadline) {
              throw new Error('Automatic community checks did not refresh within the five-minute cron window plus execution grace. Verify the Worker cron trigger is active; a newly configured Cloudflare cron may still be propagating.')
            }
            await delay(15000)
            payload = await probe()
          }
          console.log('Automatic community checks refreshed all services; unhealthy or unconfigured services are valid health results.')
          NODE
      - name: Verify Discord sign-in redirect
        run: |
          node --input-type=module <<'NODE'
          const loginUrl = new URL('https://lumen-docs-assistant.lumennetwork0.workers.dev/auth/login')
          const response = await fetch(loginUrl, { redirect: 'manual' })
          const location = response.headers.get('location')
          if (response.status !== 302 || !location) {
            throw new Error(`Discord login is not reachable: status=${response.status}`)
          }
          const authorizeUrl = new URL(location)
          if (authorizeUrl.origin !== 'https://discord.com' || authorizeUrl.pathname !== '/oauth2/authorize') {
            throw new Error(`Discord login did not redirect to OAuth: ${authorizeUrl.origin}${authorizeUrl.pathname}`)
          }
          const callbackUrl = new URL(authorizeUrl.searchParams.get('redirect_uri'))
          const state = authorizeUrl.searchParams.get('state')
          const cookie = response.headers.get('set-cookie') || ''
          if (callbackUrl.origin !== loginUrl.origin || callbackUrl.pathname !== '/auth/callback' ||
              !state || !cookie.includes(`lumen_discord_oauth_state=${state};`) ||
              !cookie.includes('Path=/auth/callback;')) {
            throw new Error('Discord login and its state cookie must use the same callback host and path.')
          }
          console.log('Discord OAuth is reachable and the callback matches the login cookie host.')
          NODE
      - name: Verify admin API CORS
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://lumenstudio.fyi/api/admin/users'
          const origin = 'https://lumenstudio.fyi'
          const preflight = await fetch(endpoint, {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'GET',
              'Access-Control-Request-Headers': 'authorization',
            },
          })
          if (preflight.status !== 204 || preflight.headers.get('access-control-allow-origin') !== origin) {
            throw new Error(`Admin CORS preflight failed: status=${preflight.status}, allow-origin=${preflight.headers.get('access-control-allow-origin')}`)
          }
          const response = await fetch(endpoint, {
            headers: { Origin: origin, Authorization: 'Bearer invalid-deployment-smoke-test' },
          })
          if (response.status !== 401 || response.headers.get('access-control-allow-origin') !== origin) {
            throw new Error(`Admin endpoint smoke test failed: status=${response.status}, allow-origin=${response.headers.get('access-control-allow-origin')}, body=${await response.text()}`)
          }
          console.log('Same-origin admin route and authenticated API response are reachable.')
          NODE
