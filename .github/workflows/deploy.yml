name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "worker/**"
      - "shared/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test bug report worker
        run: npm run test:worker
      - name: Test licensing dashboard logic
        run: npm run test:licensing
      - name: Test compatibility and website tools
        run: npm run test:website
      - name: Build site
        env:
          VITE_DOCS_ASSISTANT_ENDPOINT: https://lumenstudio.fyi/api/chat
          VITE_DOCS_ASSISTANT_LOGIN_ENDPOINT: https://lumen-docs-assistant.lumennetwork0.workers.dev
          VITE_DINO_DISCOVERIES_ENDPOINT: ${{ vars.DINO_DISCOVERIES_ENDPOINT }}
        run: npm run docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts | any(.name == "github-pages" and .expired == false)' | grep -qx true; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact is not yet visible to the deployment API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
