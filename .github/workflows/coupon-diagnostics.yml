name: Coupon reward diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Inspect aggregate reward health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database`
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' }
          async function call(url, options = {}) {
            const response = await fetch(url, { ...options, headers })
            const data = await response.json()
            if (!response.ok || !data.success) throw new Error('D1 diagnostics request failed')
            return data.result
          }
          const databases = await call(base + '?per_page=100')
          const db = databases.find(row => row.name === 'lumen-community')
          if (!db?.uuid) throw new Error('Community database not found')
          for (const sql of [
            'SELECT name,status,checked_at FROM coupon_scan_state',
            'SELECT kind,state,COUNT(*) AS total FROM coupon_rewards GROUP BY kind,state',
          ]) {
            const result = await call(`${base}/${db.uuid}/query`, { method: 'POST', body: JSON.stringify({ sql }) })
            for (const row of result[0]?.results || []) console.log(JSON.stringify(row))
          }
          NODE
      - name: Capture safe scheduled-check diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 365s npx --yes wrangler@4.160.0 tail lumen-docs-assistant --format json 2>/dev/null \
            | jq --unbuffered -r '.logs[]?.message | select(.[0] | test("^(Coupon review checks failed:|Loyalty coupon check failed:|Coupon creation could not be confirmed:|Coupon checks failed)$")) | map(select(type == "string")) | join(" ") | select(test("^[A-Za-z0-9 .:()_-]{1,200}$"))'
          result=${PIPESTATUS[0]}
          if [ "$result" != "0" ] && [ "$result" != "124" ]; then
            echo "::error::Worker diagnostics stream was unavailable."
            exit "$result"
          fi
