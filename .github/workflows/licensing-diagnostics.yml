name: Licensing connection diagnostics

on:
  workflow_dispatch:
    inputs:
      api_hostname:
        description: "Hostname that should point at the licensing VPS"
        default: "license.lumenstudio.fyi"
        required: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Worker secret names (values are never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.0 secret list --name lumen-docs-assistant --format json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const names=JSON.parse(s).map(x=>x.name).sort();console.log("Worker secrets:",names.join(", ")||"(none)");for(const n of ["LICENSE_API_URL","LICENSE_ADMIN_API_TOKEN"])console.log(n, names.includes(n)?"is set as a secret":"is NOT a secret")})' \
            || echo "::warning::Could not list Worker secrets with this token."
          grep -n "LICENSE_API_URL" wrangler.toml || echo "LICENSE_API_URL is not set in wrangler.toml [vars]"
      - name: DNS and reachability
        env:
          HOST: ${{ inputs.api_hostname }}
        run: |
          echo "DNS A record for $HOST:"; dig +short A "$HOST" || true
          for url in "https://178.238.238.15/healthz" "https://$HOST/healthz"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -m 15 "$url" || echo 000)
            echo "$url -> HTTP $code $(head -c 200 /tmp/body 2>/dev/null)"
          done
      - name: Cloudflare token DNS access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -m 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=lumenstudio.fyi" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("Zone readable:",r.success&&r.result.length>0, r.errors?.map(e=>e.message).join("; ")||"")})'
      - name: Live licensing status seen by the Worker
        run: |
          curl -s -m 15 -H "Origin: https://lumenstudio.fyi" \
            https://lumen-docs-assistant.lumennetwork0.workers.dev/community/status \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const x of JSON.parse(s).services)console.log(x.id, x.automaticStatus, x.checkedAt)})'
